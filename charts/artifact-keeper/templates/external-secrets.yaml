{{/*
=============================================================================
EXAMPLE CONFIGURATION - Getting Started Template
=============================================================================
This file is provided as a starting point for deployments. It should be
reviewed and modified to match your specific infrastructure requirements,
security policies, and operational needs before use in production.
=============================================================================
*/}}
{{- if .Values.externalSecrets.enabled }}
# ExternalSecret that syncs core application secrets from AWS Secrets Manager
# into the Kubernetes Secret used by backend, opensearch, and DependencyTrack.
#
# Prerequisites:
# 1. External Secrets Operator installed (helm install external-secrets ...)
# 2. A ClusterSecretStore named "aws-secrets-manager" configured with IRSA
#    or static credentials for accessing AWS Secrets Manager.
# 3. The referenced secrets must exist in AWS Secrets Manager with the
#    expected JSON keys.
#
# Database: by default dbCredentials must carry a pre-composed `database-url`
# property. Set externalSecrets.composeDatabaseUrl=true when it is an
# RDS-managed master-user secret instead — those contain only `username` and
# `password`, and DATABASE_URL is then composed here via ESO v2 templating
# (urlquery-escaped) from those plus externalDatabase.host/port/database, so it
# tracks RDS password rotation.
{{- if .Values.externalSecrets.composeDatabaseUrl }}
{{- if and (not .Values.postgres.enabled) (eq .Values.externalDatabase.host "") }}
{{- fail "externalDatabase.host is required when externalSecrets.composeDatabaseUrl=true — ESO templates DATABASE_URL from the RDS-managed username/password plus this host" -}}
{{- end }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-secrets
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: {{ .Values.externalSecrets.storeKind }}
  target:
    name: {{ include "artifact-keeper.fullname" . }}-secrets
    creationPolicy: Owner
    {{- if .Values.externalSecrets.composeDatabaseUrl }}
    # A `template` block replaces the whole rendered Secret, so every key the
    # workloads read has to be re-emitted here, not just DATABASE_URL. The ESO
    # sprig expressions are built as plain Go strings so Helm leaves them alone
    # and ESO evaluates them at sync time.
    template:
      engineVersion: v2
      data:
        {{- $esoUser := "{{ .db_username | urlquery }}" }}
        {{- $esoPass := "{{ .db_password | urlquery }}" }}
        DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" $esoUser $esoPass .Values.externalDatabase.host (.Values.externalDatabase.port | default 5432) .Values.externalDatabase.database | quote }}
        POSTGRES_PASSWORD: {{ "{{ .db_password }}" | quote }}
        JWT_SECRET: {{ "{{ .JWT_SECRET }}" | quote }}
        S3_ACCESS_KEY_ID: {{ "{{ .S3_ACCESS_KEY_ID }}" | quote }}
        S3_SECRET_ACCESS_KEY: {{ "{{ .S3_SECRET_ACCESS_KEY }}" | quote }}
        OPENSEARCH_USERNAME: {{ "{{ .OPENSEARCH_USERNAME }}" | quote }}
        OPENSEARCH_PASSWORD: {{ "{{ .OPENSEARCH_PASSWORD }}" | quote }}
        {{- if .Values.dependencyTrack.enabled }}
        DEPENDENCY_TRACK_ADMIN_PASSWORD: {{ "{{ .DEPENDENCY_TRACK_ADMIN_PASSWORD }}" | quote }}
        {{- end }}
        {{- if .Values.externalSecrets.secrets.smtpPassword }}
        SMTP_PASSWORD: {{ "{{ .SMTP_PASSWORD }}" | quote }}
        {{- end }}
        {{- if .Values.externalSecrets.secrets.migrationEncryptionKey }}
        MIGRATION_ENCRYPTION_KEY: {{ "{{ .MIGRATION_ENCRYPTION_KEY }}" | quote }}
        {{- end }}
        {{- if .Values.externalSecrets.secrets.webhookSecretKey }}
        AK_WEBHOOK_SECRET_KEY: {{ "{{ .AK_WEBHOOK_SECRET_KEY }}" | quote }}
        {{- end }}
    {{- end }}
  data:
    # JWT signing secret
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.jwtSecret }}
        property: jwt-secret
    {{- if .Values.externalSecrets.composeDatabaseUrl }}
    # RDS-managed master-user secret: JSON has `username` and `password` only.
    # These land in the intermediate data map and are consumed by the template
    # block above; they are not written to the final Secret.
    - secretKey: db_username
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.dbCredentials }}
        property: username
    - secretKey: db_password
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.dbCredentials }}
        property: password
    {{- else }}
    # Database credentials
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.dbCredentials }}
        property: database-url
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.dbCredentials }}
        property: password
    {{- end }}
    # S3 storage credentials. The secret keys match the environment variables
    # the backend reads (S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY).
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.s3Keys }}
        property: access-key
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.s3Keys }}
        property: secret-key
    # OpenSearch admin credentials
    - secretKey: OPENSEARCH_USERNAME
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.opensearchAuth }}
        property: username
    - secretKey: OPENSEARCH_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.opensearchAuth }}
        property: password
    # DependencyTrack admin password. The key must be
    # DEPENDENCY_TRACK_ADMIN_PASSWORD to match the chart-managed Secret
    # (templates/secrets.yaml) and the dtrack-init Job's secretKeyRef.
    {{- if .Values.dependencyTrack.enabled }}
    - secretKey: DEPENDENCY_TRACK_ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.dtAdminPassword }}
        property: admin-password
    {{- end }}
    # SMTP password (when email delivery is configured)
    {{- if .Values.externalSecrets.secrets.smtpPassword }}
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.smtpPassword }}
        property: smtp-password
    {{- end }}
    # Migration encryption key — required at runtime to encrypt
    # source-connection credentials in the migration_jobs table. Without it,
    # POST /api/v1/migrations/connections returns 500.
    {{- if .Values.externalSecrets.secrets.migrationEncryptionKey }}
    - secretKey: MIGRATION_ENCRYPTION_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.migrationEncryptionKey }}
        property: migration-encryption-key
    {{- end }}
    # Webhook signing-secret encryption key — required at runtime to encrypt
    # webhook signing secrets at rest. Without it, webhook create and
    # rotate-secret are disabled with a startup warning.
    {{- if .Values.externalSecrets.secrets.webhookSecretKey }}
    - secretKey: AK_WEBHOOK_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.webhookSecretKey }}
        property: webhook-secret-key
    {{- end }}
{{- end }}
