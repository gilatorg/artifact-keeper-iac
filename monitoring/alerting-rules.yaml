# EXAMPLE CONFIGURATION - Getting Started Template
# =============================================================================
# This file is provided as a starting point for deployments. It should be
# reviewed and modified to match your specific infrastructure requirements,
# security policies, and operational needs before use in production.
# =============================================================================
# Gilat adaptation for gfrog-stage/gfrog-prod (namespaces gfrog-*):
#   * release=kube-prometheus-stack, the label our Prometheus convention uses.
#   * namespace=~"gfrog-.*" instead of artifact-keeper.*, and ak_* queries
#     aggregate by namespace so stage and prod alert independently.
#   * HighLatency reads the ak_http_request_duration_seconds SUMMARY quantile;
#     the backend exposes no _bucket series.
#   * DependencyTrackDown uses kube-state-metrics deployment availability;
#     no scrape job matches .*dtrack.*.
# Not deployed by the chart: apply by hand
#   kubectl --context devops-infra-prod apply -f monitoring/alerting-rules.yaml
# =============================================================================

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: artifact-keeper-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: artifact-keeper
spec:
  groups:
    - name: artifact-keeper.rules
      rules:
        - alert: ArtifactKeeperHighErrorRate
          expr: |
            (
              sum by (namespace) (rate(ak_http_responses_total{namespace=~"gfrog-.*", status=~"5.."}[5m]))
              /
              sum by (namespace) (rate(ak_http_responses_total{namespace=~"gfrog-.*"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate on Artifact Keeper"
            description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

        - alert: ArtifactKeeperHighLatency
          expr: |
            max by (namespace) (ak_http_request_duration_seconds{namespace=~"gfrog-.*", quantile="0.99"}) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High P99 latency on Artifact Keeper"
            description: "P99 latency is {{ $value | humanizeDuration }} (threshold: 2s)"

        - alert: ArtifactKeeperPodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~"gfrog-.*"}[1h]) > 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Artifact Keeper pod restarting frequently"
            description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour"

        - alert: ArtifactKeeperPodNotReady
          expr: |
            kube_pod_status_ready{namespace=~"gfrog-.*", condition="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Artifact Keeper pod not ready"
            description: "Pod {{ $labels.pod }} has been not ready for 5 minutes"

        - alert: ArtifactKeeperStorageHigh
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace=~"gfrog-.*"}
              /
              kubelet_volume_stats_capacity_bytes{namespace=~"gfrog-.*"}
            ) > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Artifact Keeper storage usage high"
            description: "PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"

        - alert: DependencyTrackDown
          expr: |
            kube_deployment_status_replicas_available{namespace=~"gfrog-.*", deployment=~".*-dtrack"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "DependencyTrack is down"
            description: "DependencyTrack has been unreachable for 5 minutes"

        - alert: ArtifactKeeperDatabaseConnectionFailure
          expr: |
            increase(ak_http_responses_total{namespace=~"gfrog-.*", status="503"}[5m]) > 10
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Possible database connection failure"
            description: "High number of 503 responses suggesting backend connectivity issues"
